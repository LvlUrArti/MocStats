[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "PTH",      # Use of os.path
  "BLE001",   # Catch all exceptions
  "ASYNC230", # Use "with open" in async context
  "ASYNC250", # Use "input" in async context
  "S301",     # Use pickle package
  "S603",     # Use of subprocess
  "S607",     # Use of check_output
  "INP001",   # Checks for packages that are missing an __init__.py file
  "DTZ005",   # Use of naive datetime
  "DTZ006",   # Use of naive datetime
  "DTZ007",   # Use of naive datetime
  "T201",     # print
  "TD002",    # Missing TODO author
  "TD003",    # Missing TODO link
  # Rules below should be enabled again
  "C901",    # Complexity
  "PLR0912", # Too many branches
  "PLR0915", # Too many statements
  "PLR2004", # Magic value used in comparison
  "PLW0603", # Using the global statement
]
# Enforce typing-related rules
[tool.pyright]
typeCheckingMode = "strict"
extraPaths = ["./MocStats/scripts"]
[tool.ruff.lint.flake8-builtins]
strict-checking = true
[tool.ruff.lint.flake8-type-checking]
strict = true
